// ---------------------------------------------------------------------------
// Input: driver -> DLL, over `GameSdkRpc.push_input`. Never seen by the game.
// ---------------------------------------------------------------------------

message InputPush {
  repeated InstanceInput instances = 1;
}

// Input for one instance, from the connection that drives it.
message InstanceInput {
  uint32 instance = 1;
  // Edges due now, in order; the game sees them at its next poll.
  repeated InputEvent events = 2;
  // The driver's own sequence number, echoed as `FrameMsg.input_seq` on the
  // frames produced after the game took this input.
  uint64 seq = 3;
}
