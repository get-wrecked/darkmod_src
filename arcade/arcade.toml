# The arcade build of The Dark Mod, for `arcade-sdk describe` and `arcade-sdk submit`.
# Directories are relative to this file; paths inside one are relative to it.
# Stage the client folder first: ./stage_build.sh (see README.md in this directory).

# Your game id, exactly as the build registers it (InitRequest.game_id).
game_id = "thedarkmod"
# This build's version, [A-Za-z0-9._-]. Never reused: bump it for every submit
# (or pass `arcade-sdk submit --build-id`). stage_build.sh writes the same id into
# run_arcade.sh (+set arcade_buildId) so the registration and the artifact agree.
build_id = "2.15-avsync.20261002.1"
# Recorded on the submission: what changed, what to look at.
notes = "Synchronized Arcade media candidate: OpenAL final mix at 44100 Hz stereo, source-timed 640x360 video, SDK fc970a05a52fb4abec49122e42928c574da6e2e0 (ABI 2). Existing 48 benchmark cases on A New Job and Tears of St. Lucia. Depends on ai-research PR 4128."

# The game the agent plays. It embeds the arcade SDK library.
[client]
dir = "out/client"
# A script with a #! line: sets arcade_enable, the build id, window size from SCREEN_WIDTH/HEIGHT.
entrypoint = "run_arcade.sh"
# Together these must take the game straight into a state where a challenge can
# start: no launcher, login or menu.
args = []
# The .proto source of our services: what benchmarks against them are written from.
vendor_proto = "vendor.proto"
# The Windows build (under Proton) is arcade-windows.toml.
platform = "linux-x86_64"
